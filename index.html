<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b002b">
<title>Kartcis Frame</title>
<meta name="description" content="Foto dengan frame Kartcis, lalu bagikan ke story.">
<link rel="icon" href="assets/mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@600;700;800&family=Poppins:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root { --mag: #ad0358; --deep: #5b002b; --amb: #febc59; --ink: #1a1a1a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #12060d; color: #fff; font-family: "Open Sans", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; min-height: 100dvh; padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 4px 8px; width: 100%; max-width: 520px; }
  header img { height: 26px; }
  header h1 { font-size: 17px; font-weight: 800; margin: 0; }
  header small { margin-left: auto; color: #c9a6b8; font-size: 12px; }
  .stage { position: relative; height: min(calc(100dvh - 230px), 860px); aspect-ratio: 9 / 16; max-width: 100%; border-radius: 18px; overflow: hidden; background: #000; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .stage canvas { position: relative; z-index: 1; width: 100%; height: 100%; display: block; }
  .stage .feed { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
  #count { position: absolute; inset: 0; display: grid; place-items: center; font: 900 120px Poppins, sans-serif; color: #fff; text-shadow: 0 6px 0 var(--deep); pointer-events: none; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .35s; }
  #flash.on { opacity: .9; transition: none; }
  .frames { display: flex; gap: 8px; margin: 12px 0 6px; overflow-x: auto; max-width: 100%; }
  .chip { border: 2px solid #5a2a43; background: #22101a; color: #fff; border-radius: 999px; padding: 8px 16px; font: 700 14px "Open Sans", sans-serif; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--mag); border-color: var(--amb); }
  .controls { display: flex; align-items: center; justify-content: center; gap: 34px; padding: 8px 0 14px; }
  .side { width: 52px; height: 52px; border-radius: 50%; border: 2px solid #5a2a43; background: #22101a; color: #fff; display: grid; place-items: center; }
  .side svg { width: 24px; height: 24px; }
  #shutter { width: 78px; height: 78px; border-radius: 50%; border: 6px solid var(--amb); background: #fff; box-shadow: 0 0 0 4px var(--mag); }
  #shutter:active { transform: scale(.94); }
  #timer[aria-pressed="true"] { border-color: var(--amb); color: var(--amb); }
  #result, #perm { position: fixed; inset: 0; background: rgba(18,6,13,.97); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; }
  #result[hidden], #perm[hidden] { display: none; }
  #shot { max-height: calc(100dvh - 220px); max-width: 100%; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btn { border: 0; border-radius: 999px; padding: 13px 22px; font: 800 15px "Open Sans", sans-serif; background: var(--mag); color: #fff; }
  .btn.alt { background: #2b1520; border: 2px solid #5a2a43; }
  .note { color: #c9a6b8; font-size: 12px; margin: 0; text-align: center; }
  #perm p { max-width: 320px; text-align: center; line-height: 1.5; margin: 0; }
  button { cursor: pointer; }
</style>
</head>
<body>
<header>
  <img src="assets/mark.svg" alt="Kartcis">
  <h1>Kartcis Frame</h1>
  <small>Foto, lalu bagikan ke story</small>
</header>

<main class="stage">
  <canvas id="view" width="540" height="960" aria-label="Pratinjau kamera dengan frame Kartcis"></canvas>
  <div id="count"></div>
  <div id="flash"></div>
</main>

<nav class="frames" id="frames" aria-label="Pilih frame"></nav>

<div class="controls">
  <button class="side" id="upload" aria-label="Pilih foto dari galeri">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
  </button>
  <button id="shutter" aria-label="Ambil foto"></button>
  <button class="side" id="flip" aria-label="Ganti kamera depan/belakang">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M8 16H3v5"/></svg>
  </button>
  <button class="side" id="timer" aria-pressed="false" aria-label="Timer 3 detik">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M9 2h6"/></svg>
  </button>
</div>

<section id="result" hidden>
  <img id="shot" alt="Hasil foto dengan frame Kartcis">
  <div class="actions">
    <button class="btn" id="share">Bagikan ke Story</button>
    <button class="btn alt" id="save">Simpan</button>
    <button class="btn alt" id="again">Ulangi</button>
  </div>
  <p class="note">Foto diproses di HP kamu, tidak diunggah ke mana pun.</p>
</section>

<section id="perm" hidden>
  <p id="permText">Izinkan akses kamera untuk foto dengan frame Kartcis. Atau pakai foto dari galeri.</p>
  <div class="actions">
    <button class="btn" id="retry">Coba kamera lagi</button>
    <button class="btn alt" id="gallery">Pilih dari galeri</button>
  </div>
</section>

<input type="file" id="file" accept="image/*" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
